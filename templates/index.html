<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Genre Selection</title>
</head>
<body>
  <h1>Select Your Favorite Genres</h1>
  <form method="POST" action="{{ url_for('index') }}">
    {{ MGform.hidden_tag() }}
    
    {% for subfield in MGform.chosen_genres %}
      <div>
        {{ subfield }} {{ subfield.label.text }}
      </div>
    {% endfor %}
    
    {{ MGform.submit() }}
  </form>
</body>
</html>
